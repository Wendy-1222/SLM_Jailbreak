default_method_hyperparameters:
    num_steps: 100
    eval_steps: 5
    num_test_cases_per_behavior: 1
    batch_size: 64 # number of parallel mutations
    num_elites: 0.1
    crossover: 0.5
    num_points: 5
    mutation: 0.01
    eval_with_check_refusal: True
    # targets_path: ./data/optimizer_targets/extra_targets/advbench_subset_targets.json
    targets_path: ./data/optimizer_targets/extra_targets/adjusted_advbench_added_targets.json
    # using gpt mutate model
    # mutate_target_model:
    #   model_name_or_path: gpt-3.5-turbo-1106
    #   token: <openai_api_token>

    # using open-source mutate model
    # mutate_model:
    #   model_name_or_path: mistralai/Mistral-7B-Instruct-v0.2
    #   use_vllm: True
    #   num_gpus: 1
    #   dtype: bfloat16
    mutate_model:
      model_name_or_path: /data/hzq/models/vicuna1.5_13b
#      model_name_or_path: /data2/SLMs/SmolLM_series/SmolLM-135M-Instruct
      trust_remote_code: True
#      use_vllm: True
      num_gpus: 1
      dtype: bfloat16
        # uncomment this to use toghether api instead of gpus, will override num_gpus
        # together_api_key: <together_api_key>

